# =============================================================================
# Project settings — this is the only file to edit for a new client / category.
#
# 1. Fill in the values below.
# 2. Put PROFOUND_API_KEY in .env (see .env.example).
# 3. Add one [[countries]] table per Profound category. A pull writes
#    data/{slug}/, then combines scores and citations into data/.
# 4. Run a full export:  python -m pipeline
# =============================================================================

[project]
# Owned brand that must always appear in fact_scores_summarized, even if it
# ranks outside the top N. Must match the asset name in Profound.
owned_asset = "Ergon"

# Extra Profound asset names that must always appear in fact_scores_summarized,
# even if they rank outside the top N. Marked is_owned. An alias is exported
# only when that category tracks the exact name.
owned_aliases = []

# Hostnames or registrable domains whose citation category is forced to Owned.
# A row matches if hostname or domain equals an entry, or hostname is a
# subdomain of one (case-insensitive). Use a domain like ergon.com to
# cover all subdomains; use a full hostname for a specific third-party host.
# owned_citation_contains matches any hostname or domain that includes the
# text, so a country site that contains ergon is Owned without listing
# each country code. Product sites that do not contain that text stay in
# owned_citation_hosts.
# citation-domains/citation-domains-{slug}.csv overrides category when domain matches.
# A domain that is not in the file keeps the Profound category, including the
# Owned overrides above. The same file name applies to every country; a missing
# file leaves that country on the Profound category.
owned_citation_contains = ["ergon"]
owned_citation_hosts = ["ergon.com"]

# Inclusive first date to pull (YYYY-MM-DD). Both fact tables scan through
# yesterday; today's date is never requested. Ergon visibility starts in
# September 2026.
start_date = "2026-09-01"

# One Profound category per entry. Each category covers several countries;
# the country is the region column on fact_scores_summarized, not the slug.
# slug is the data/ folder name. owned_asset falls back to [project] owned_asset.
[[countries]]
slug = "americas-uk-au-uae"
name = "United States, Mexico, Brazil, United Kingdom, Australia, United Arab Emirates"
category_id = "6f0ee61a-a04c-4b84-87dc-3d720b93d8c1"
owned_asset = "Ergon"

[[countries]]
slug = "europe-asia"
name = "Belgium, France, Germany, Spain, Sweden, Indonesia, Singapore, South Korea, Vietnam"
category_id = "61d4fa1f-7d52-4edc-83d1-e5ae1f3b4265"
owned_asset = "Ergon"

[ranking]
# Number of brands kept per metric in each topic. The export unions top_n by
# visibility, share of voice, average position, and positive sentiment
# (plus owned_asset and owned_aliases).
top_n = 20

# Trailing days used to rank those brands (ending yesterday).
lookback_days = 30

[api]
# Profound hourly REST quota. Leave at 600 unless Profound gives you another limit.
hourly_limit = 600
