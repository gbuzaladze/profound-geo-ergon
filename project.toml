# =============================================================================
# Project settings — this is the only file to edit for a new client / category.
#
# 1. Fill in the values below.
# 2. Put PROFOUND_API_KEY in .env (see .env.example).
# 3. Add one [[countries]] table per Profound category. Exports land in
#    data/{slug}/ and dashboards in dashboard/{slug}/.
# 4. Run a full export:  python -m pipeline
# =============================================================================

[project]
# Owned brand that must always appear in fact_scores_summarized, even if it
# ranks outside the top N. Must match the asset name in Profound.
owned_asset = "Novartis"

# Extra Profound asset names that must always appear in fact_scores_summarized,
# even if they rank outside the top N. Marked is_owned. An alias is exported
# only when that category tracks the exact name, so it is not zero-filled as a
# second brand. Do not list Novartis here: Canada uses owned_asset Novartis,
# and Mexico and Brazil use Novartis - Mexico and Novartis - Brazil.
owned_aliases = ["Kesimpta", "Kisqali", "Pluvicto", "Leqvio", "Zolgensma", "Fabhalta"]

# Hostnames or registrable domains whose citation category is forced to Owned.
# A row matches if hostname or domain equals an entry, or hostname is a
# subdomain of one (case-insensitive). Use a domain like kisqali.com to
# cover all subdomains; use a full hostname for a specific third-party host.
# owned_citation_contains matches any hostname or domain that includes the
# text, so novartis.com.br and novartis.com.mx are Owned without listing
# each country code. Product sites that do not contain that text stay in
# owned_citation_hosts.
# citation-domains/citation-domains-{slug}.csv overrides category when domain matches, and
# fills subcategory and pag (TRUE or FALSE). A domain that is not in the file
# keeps the Profound category, including the Owned overrides above, with
# subcategory and pag blank. The same file name applies to every country;
# a missing file leaves that country on the Profound category.
owned_citation_contains = ["novartis"]
owned_citation_hosts = [
  "kisqali.com",
  "kisqali-hcp.com",
  "pluvicto.com",
  "pluvicto-hcp.com",
  "kesimpta.com",
  "kesimptahcp.com",
  "fabhalta.com",
  "fabhalta-hcp.com",
  "fabhalta-id.com",
  "zolgensma.com",
  "zolgensma-hcp.com",
  "zolgensma-enrollment.com",
  "zolgensma-itvisma-copayassist.com",
  "zolgensmacopayassist.com",
  "zolgensmareimbursement.com",
  "myrules.ca",
  "myrule.com",
]

# Inclusive first date to pull (YYYY-MM-DD). Both fact tables scan through
# yesterday; today's date is never requested.
start_date = "2025-01-01"

# One Profound category per market. slug is the data/ and dashboard/ folder name.
# owned_asset is the Profound brand name used for dashboard KPIs; it falls
# back to [project] owned_asset when omitted.
[[countries]]
slug = "canada"
name = "Canada"
category_id = "7b4d2b6f-e804-4a90-9304-e4bdefebf630"
owned_asset = "Novartis"

[[countries]]
slug = "mexico"
name = "Mexico"
category_id = "be34adae-1323-41f9-877d-909239648215"
owned_asset = "Novartis - Mexico"

[[countries]]
slug = "brazil"
name = "Brazil"
category_id = "5301600f-72e4-4614-bae9-dba34650bba4"
owned_asset = "Novartis - Brazil"

[ranking]
# Number of brands kept per metric in each topic. The export unions top_n by
# visibility, share of voice, average position, and positive sentiment
# (plus owned_asset and owned_aliases).
top_n = 20

# Trailing days used to rank those brands (ending yesterday).
lookback_days = 30

[api]
# Profound hourly REST quota. Leave at 600 unless Profound gives you another limit.
hourly_limit = 600
