# Package metadata and direct runtime dependencies. Python is pinned to 3.12
# because the source uses Python 3.12 type-parameter syntax.
[project]
name = "profound-data-pipeline"
version = "0.1.0"
description = "Extract Profound visibility data for Power BI."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-functions==1.25.0",
    "azure-functions-durable==1.7.0",
    "azure-identity>=1.19.0,<2",
    "instaloader==4.15.3",
    "mssql-python==1.14.0",
    "profound==0.56.0",
    "python-dotenv==1.1.1",
    "tldextract==5.3.0",
    "tzdata==2026.3",
]

# Console entry points expose individual exports and the combined pipeline.
[project.scripts]
export-scores-summarized = "pipeline.scores_summarized:main"
export-raw-citations = "pipeline.raw_citations:main"
export-raw-citations-full = "pipeline.raw_citations:main_full"
export-prompts = "pipeline.prompts:main"
export-dims = "pipeline.dims:main"
export-db = "pipeline.db:main"
export-all = "pipeline.__main__:main"

# Hatchling packages the src-layout module for Azure deployment and local use.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
